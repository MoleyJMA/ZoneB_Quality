<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Quality Check</title>
  <meta name="theme-color" content="#343372" />
  <meta name="description" content="Battery cell quality check simulation" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Quality Check" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    :root {
      --purple: #343372;
      --light_purple: #967aed;
      --yellow: #f6b141;
      --panel: rgba(255,255,255,0.92);
      --text: #0b1220;
    }
    * { -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center; color: var(--text);
      background: var(--purple);
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
               env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      box-sizing: border-box;
      overflow-y: auto;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
    }
    input { -webkit-user-select: text; user-select: text; }
    body.raise   { background: var(--light_purple); }
    body.summary { background: var(--yellow); }

    .screen {
      width: min(760px, 92vw); background: var(--panel); border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.18); padding: 28px;
      box-sizing: border-box; margin: 16px 0;
    }
    h1 { margin: 0 0 10px; font-size: 2rem; }
    p, li { line-height: 1.45; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0; }
    .card {
      background: rgba(255,255,255,0.7); border: 1px solid rgba(0,0,0,0.08);
      border-radius: 14px; padding: 14px;
    }
    .label { font-size: 0.9rem; opacity: 0.75; }
    .value { font-size: 1.4rem; font-weight: 800; margin-top: 6px; }
    .btnbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    button {
      appearance: none; border: 0; border-radius: 14px; padding: 12px 16px;
      font-size: 1rem; font-weight: 650; cursor: pointer;
      box-shadow: 0 10px 26px rgba(0,0,0,0.16);
    }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #2563eb; outline-offset: 2px;
    }
    .primary   { background: #2563eb; color: #fff; }
    .good      { background: #15803d; color: #fff; }
    .warn      { background: #b45309; color: #fff; }
    .danger    { background: #b91c1c; color: #fff; }
    .secondary { background: #111827; color: #fff; }
    input, select {
      width: 100%; padding: 8px 10px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.15);
      font-size: 1rem; background: #fff; box-sizing: border-box;
    }
    .hint { font-size: 0.95rem; opacity: 0.8; }
    .pill {
      display: inline-block; padding: 6px 10px; border-radius: 999px; font-weight: 800;
      background: rgba(0,0,0,0.08);
    }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .checkbox-row input[type="checkbox"] { width: auto; margin: 0; }
    .checkbox-row label { padding: 4px 0; }
    .stack > .card { margin-top: 14px; }

    @media (max-width: 480px) {
      .screen { padding: 20px; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <main class="screen" id="app"></main>

<script>
(function () {
  "use strict";

  // --- SPEC LIMITS (what "in spec" means) ---
  const SPEC = {
    Temperature: [27.0, 33.0], // °C
    OCV:         [2.70, 3.10], // V
    ACIR:        [27.0, 33.0], // mΩ
  };

  // --- GENERATION LIMITS (what random values can be) ---
  const GEN = {
    Temperature: [27.0, 36.0],
    OCV:         [2.55, 3.25],
    ACIR:        [22.0, 38.0],
  };

  const METRICS = ["Temperature", "OCV", "ACIR"];
  const uniform = (a, b) => a + Math.random() * (b - a);
  const round = (x, n) => { const f = Math.pow(10, n); return Math.round(x * f) / f; };
  const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // Display numbers the way the original did (30 -> "30.0", 3.1 -> "3.1")
  const fmt = (x) => { const s = String(x); return /[.e]/.test(s) ? s : s + ".0"; };

  function newMeasurements() {
    const inSpecCell = Math.random() < 0.8; // 80% of cells fully in-spec
    let t, ocv, acir, out = [];

    if (inSpecCell) {
      t    = round(uniform(...SPEC.Temperature), 1);
      ocv  = round(uniform(...SPEC.OCV), 3);
      acir = round(uniform(...SPEC.ACIR), 1);
    } else {
      t    = round(uniform(...GEN.Temperature), 1);
      ocv  = round(uniform(...GEN.OCV), 3);
      acir = round(uniform(...GEN.ACIR), 1);

      const forced = choice(METRICS);
      if (forced === "Temperature") {
        t = Math.random() < 0.5 ? SPEC.Temperature[0] - uniform(1, 3)
                                : SPEC.Temperature[1] + uniform(1, 3);
        out.push("Temperature");
      }
      if (forced === "OCV") {
        ocv = Math.random() < 0.5 ? SPEC.OCV[0] - uniform(0.05, 0.2)
                                  : SPEC.OCV[1] + uniform(0.05, 0.2);
        out.push("OCV");
      }
      if (forced === "ACIR") {
        acir = Math.random() < 0.5 ? SPEC.ACIR[0] - uniform(2, 5)
                                   : SPEC.ACIR[1] + uniform(2, 5);
        out.push("ACIR");
      }
      for (const m of METRICS) {
        if (!out.includes(m) && Math.random() < 0.3) out.push(m);
      }
    }

    return {
      Temperature: round(t, 2),
      OCV: round(ocv, 2),
      ACIR: round(acir, 2),
      out_of_spec: out,
      flagged: false,
      quality_form: null,
    };
  }

  // ---------- state (kept in sessionStorage, like a non-permanent session) ----------
  const KEY = "zoneb-qual-state-v1";
  let state = load();
  let view = state && state.total_cells ? "measure" : "instructions";

  function blank() {
    return { measured_count: 0, raised_count: 0, false_raises: 0, missed_flags: [], cells: [] };
  }
  function load() {
    try { const s = sessionStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }
  function save() {
    try { sessionStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function clear() {
    state = null;
    try { sessionStorage.removeItem(KEY); } catch (e) {}
  }
  function ensureState() { return !!(state && state.total_cells && state.current_cell && state.cells); }

  // ---------- rendering ----------
  const app = document.getElementById("app");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function go(v) {
    view = v;
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    // Guards: without simulation state, fall back to the start screen
    if ((view === "measure" || view === "flag") && !ensureState()) view = "instructions";
    if ((view === "setup" || view === "summary") && !state) view = "instructions";
    document.body.className = view === "flag" ? "raise" : view === "summary" ? "summary" : "";
    ({ instructions, setup, measure, flag, summary })[view]();
  }

  function instructions() {
    app.innerHTML = `
      <h1>Quality Check Instructions</h1>
      <ul>
        <li>This machine measures temperature, OCV, and ACIR.</li>
        <li>Click the button below to turn on the machine and begin your quality check.</li>
      </ul>
      <div class="btnbar">
        <button class="primary" id="start">Go to Setup</button>
      </div>`;
    document.getElementById("start").onclick = () => {
      state = blank();
      save();
      go("setup");
    };
  }

  function setup() {
    const opts = Array.from({ length: 20 }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join("");
    app.innerHTML = `
      <h1>Tray setup</h1>
      <p class="hint">Enter how many rows and columns of cells are on your tray.</p>
      <form id="setupForm">
        <div class="row">
          <div class="card">
            <label class="label" for="rows">Rows</label>
            <select id="rows" required>${opts}</select>
          </div>
          <div class="card">
            <label class="label" for="cols">Columns</label>
            <select id="cols" required>${opts}</select>
          </div>
        </div>
        <div class="btnbar">
          <button class="primary" type="submit">Start measuring</button>
        </div>
      </form>`;
    document.getElementById("setupForm").onsubmit = (e) => {
      e.preventDefault();
      const rows = parseInt(document.getElementById("rows").value, 10) || 0;
      const cols = parseInt(document.getElementById("cols").value, 10) || 0;
      if (rows <= 0 || cols <= 0) return;
      const total = rows * cols;
      Object.assign(state, {
        rows, cols, total_cells: total, current_cell: 1, cells: new Array(total).fill(null),
      });
      save();
      go("measure");
    };
  }

  function measure() {
    const idx = state.current_cell;
    const total = state.total_cells;
    if (state.cells[idx - 1] === null) {
      state.cells[idx - 1] = newMeasurements();
      save();
    }
    const cell = state.cells[idx - 1];
    const isLast = idx === total;

    app.innerHTML = `
      <h1>Measurements</h1>
      <p><span class="pill">Cell ${idx} of ${total}</span></p>
      <div class="row">
        <div class="card">
          <div class="label">Temperature (°C)</div>
          <div class="value">${fmt(cell.Temperature)}</div>
        </div>
        <div class="card">
          <div class="label">OCV (V)</div>
          <div class="value">${fmt(cell.OCV)}</div>
        </div>
      </div>
      <div class="card">
        <div class="label">ACIR (mΩ)</div>
        <div class="value">${fmt(cell.ACIR)}</div>
      </div>
      <div class="btnbar">
        <button class="warn" id="flagBtn">Flag to Quality</button>
        ${isLast ? "" : '<button class="good" id="nextBtn">Next</button>'}
        <button class="danger" id="endBtn">End Quality Check</button>
      </div>`;

    const recordMissedIfNeeded = () => {
      if (cell.out_of_spec.length && !cell.flagged && !state.missed_flags.includes(idx)) {
        state.missed_flags.push(idx);
      }
    };

    document.getElementById("flagBtn").onclick = () => go("flag");

    const next = document.getElementById("nextBtn");
    if (next) next.onclick = () => {
      recordMissedIfNeeded();
      state.measured_count += 1;
      if (idx < total) state.current_cell = idx + 1;
      save();
      go("measure");
    };

    document.getElementById("endBtn").onclick = () => {
      recordMissedIfNeeded();
      state.measured_count += 1;
      save();
      go("summary");
    };
  }

  function flag() {
    const idx = state.current_cell;
    const total = state.total_cells;
    const cell = state.cells[idx - 1];

    app.innerHTML = `
      <h1>Flag to Quality</h1>
      <p><span class="pill">Cell ${idx} of ${total}</span></p>

      <div class="card">
        <div class="row"><div class="label"><b>Cell Temperature:</b></div><div class="label"><b>${fmt(cell.Temperature)}</b></div></div>
        <div class="row"><div class="label"><b>Cell OCV:</b></div><div class="label"><b>${fmt(cell.OCV)}</b></div></div>
        <div class="row"><div class="label"><b>Cell ACIR:</b></div><div class="label"><b>${fmt(cell.ACIR)}</b></div></div>
      </div>

      <form id="flagForm">
        <div class="row">
          <div class="card">
            <label class="label" for="cell_number">Cell number:</label>
            <input id="cell_number" inputmode="numeric" autocomplete="off" placeholder="e.g.${idx}" required />
          </div>
          <div class="card">
            <label class="label" for="cell_batch">Cell batch:</label>
            <input id="cell_batch" autocomplete="off" autocapitalize="characters" placeholder="e.g., BATCH-17" required />
          </div>
        </div>

        <div class="card">
          <div class="label">Value out of spec:</div>
          ${METRICS.map((m) => `
            <div class="checkbox-row">
              <input type="checkbox" id="vo_${m}" value="${m}">
              <label for="vo_${m}">${m}</label>
            </div>`).join("")}
        </div>

        <div class="btnbar">
          <button class="good" type="submit">Submit to Quality</button>
          <button class="secondary" type="button" id="backBtn">Back to measurement</button>
        </div>
      </form>`;

    document.getElementById("backBtn").onclick = () => go("measure");

    document.getElementById("flagForm").onsubmit = (e) => {
      e.preventDefault();
      cell.flagged = true;
      cell.quality_form = {
        cell_number: document.getElementById("cell_number").value.trim(),
        cell_batch: document.getElementById("cell_batch").value.trim(),
        value_out: METRICS.filter((m) => document.getElementById("vo_" + m).checked),
      };
      state.raised_count += 1;
      if (!cell.out_of_spec.length) state.false_raises += 1; // flagged a fully in-spec cell

      state.cells[idx - 1] = cell;
      state.measured_count += 1;
      if (idx < total) state.current_cell = idx + 1;
      save();
      go(idx < total ? "measure" : "summary");
    };
  }

  function summary() {
    app.innerHTML = `
      <h1>Quality Check ended</h1>
      <p>Final results:</p>
      <div class="stack">
        <div class="row" style="margin-top:0">
          <div class="card">
            <div class="label">Number of cells measured:</div>
            <div class="value">${state.measured_count || 0}</div>
          </div>
          <div class="card">
            <div class="label">Number of cells raised to quality:</div>
            <div class="value">${state.raised_count || 0}</div>
          </div>
        </div>
        <div class="card">
          <div class="label">Number of false raises (in-spec flagged):</div>
          <div class="value">${state.false_raises || 0}</div>
        </div>
        <div class="card">
          <div class="label">Number of missed quality raises:</div>
          <div class="value">${(state.missed_flags || []).length}</div>
        </div>
      </div>
      <div class="btnbar">
        <button class="secondary" id="restart">Restart</button>
      </div>`;
    document.getElementById("restart").onclick = () => { clear(); go("instructions"); };
  }

  // ---------- fullscreen ----------
  // Installed PWA: the manifest already launches fullscreen.
  // In a normal browser tab, enter fullscreen on the first tap (where supported).
  const standalone =
    window.matchMedia("(display-mode: fullscreen)").matches ||
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  if (!standalone) {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      const once = () => {
        document.removeEventListener("click", once, true);
        try { const p = req.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {}
      };
      document.addEventListener("click", once, true);
    }
  }

  // ---------- service worker ----------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  go(view);
})();
</script>
</body>
</html>
